<!DOCTYPE html>
<html lang="es" data-theme="dark" data-lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE WATCHERS</title>
<meta name="description" content="The Watchers: vigilantes automáticos de fuentes públicas que publican ediciones con enlaces a cada fuente.">
<meta property="og:title" content="THE WATCHERS">
<meta property="og:description" content="Vigilantes automáticos de fuentes públicas que publican ediciones con enlaces a cada fuente.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0b'/%3E%3Cpath d='M16 4 26.4 10v12L16 28 5.6 22V10z' fill='none' stroke='%232ef2d0' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%23ff3e8a'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="corner brand-block">
    <a class="wordmark" href="./">· THE WATCHERS ·</a>
    <p class="sub">
      WATCHERS · <b id="digestCount">00</b>
      <span class="sep">/</span>
      <i class="dot live" aria-hidden="true">●</i> <b id="liveCount">00</b>
      <span lang="es">en línea</span><span lang="en">online</span>
      <span class="sep">/</span>
      <i class="dot" aria-hidden="true">○</i> <b id="plannedCount">00</b>
      <span lang="es">próximamente</span><span lang="en">coming soon</span>
    </p>
  </div>
  <div class="corner ctrls">
    <button id="langToggle" class="pill" type="button">EN</button>
    <button id="themeToggle" class="pill" type="button" aria-label="Cambiar tema">◐</button>
  </div>
</header>

<main>
  <canvas id="graph" role="img" aria-label="Mapa de The Watchers: cada watcher conectado a la red, con sus fuentes y su última edición."></canvas>

  <nav id="nodeList" class="node-list" aria-label="Watchers">
    <p class="eyebrow">Watchers</p>
  </nav>

  <aside id="details" class="details" aria-labelledby="detailsTitle" hidden>
    <div class="details-head">
      <span id="detailsIndex" class="idx"></span>
      <button id="detailsClose" class="details-close" type="button">
        <span lang="es">Cerrar</span>
        <span lang="en">Close</span>
      </button>
    </div>
    <p id="detailsStatus" class="status"></p>
    <h2 id="detailsTitle"></h2>
    <p id="detailsSummary" class="lede"></p>
    <div id="detailsEdition" class="edition"></div>
    <ul id="detailsRows" class="rows"></ul>
  </aside>
</main>

<p class="corner hint" aria-hidden="true">
  <span lang="es">ELIGE UN WATCHER PARA LEER SU ÚLTIMA EDICIÓN · ESC PARA CERRAR</span>
  <span lang="en">PICK A WATCHER TO READ ITS LATEST EDITION · ESC TO CLOSE</span>
</p>
<p class="corner sys" aria-hidden="true">
  <span lang="es">ÚLTIMA EDICIÓN</span><span lang="en">LATEST EDITION</span> <b id="sysLast">—</b> ·
  <b id="sysClock">--:--:--</b>
</p>

<div id="scan" aria-hidden="true"></div>
<div id="grain" aria-hidden="true"></div>

<!-- generated by scripts/export-web-editions.js; the page still works without it -->
<script src="data/editions.js"></script>
<script src="app.js"></script>
</body>
</html>
